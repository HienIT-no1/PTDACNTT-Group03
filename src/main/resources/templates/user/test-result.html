<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kết quả bài thi</title>
    <link rel="stylesheet" href="/css/common.css">
    <style>
        .result-container {
            max-width: 600px;
            margin: 50px auto;
            background: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #f8f9fa;
            border: 5px solid #28a745;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 36px;
            font-weight: bold;
            color: #28a745;
        }
        .result-detail {
            font-size: 18px;
            margin-bottom: 30px;
            color: #555;
        }
        .btn-home {
            display: inline-block;
            padding: 10px 25px;
            background: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            transition: 0.3s;
        }
        .btn-home:hover { background: #0056b3; }
    </style>
</head>
<body>

    <div class="container">
        <div class="result-container">
            <h2 th:text="'Kết quả: ' + ${test.title}">Kết quả bài thi</h2>
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
            
            <div class="score-circle">
                <span th:text="${correctCount} + '/' + ${totalQuestions}">8/10</span>
            </div>

            <div class="result-detail">
                <p>Bạn đã trả lời đúng <strong><span th:text="${correctCount}"></span></strong> câu hỏi.</p>
                <p>Tổng điểm đạt được: <strong><span th:text="${totalScore}"></span></strong> điểm.</p>
            </div>

            <a th:href="@{/user/test}" class="btn-home">Quay lại danh sách bài thi</a>
        </div>
    </div>

</body>
</html>
