<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${pageTitle}">Quản lý Tin tức</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/admin/dashboard.css">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        
        <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

        <div class="col-md-10 p-4">
            <h3 class="mb-4">Tin tức & Sự kiện</h3>
            
            <div class="card shadow-sm">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span>Danh sách bài viết</span>
                    <button class="btn btn-primary btn-sm" id="btnAdd" data-bs-toggle="modal" data-bs-target="#newsModal">
                        <i class="fa-solid fa-plus"></i> Đăng bài mới
                    </button>
                </div>
                <div class="card-body">                     
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Tên bài đăng</th>
                                <th>Loại bài đăng</th>
                                <th>Ngày đăng</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="post : ${listPosts}">
                                <td th:text="${post.id}"></td>
                                <td th:text="${post.title}" class="fw-bold"></td>
                                <td th:text="${post.type}"></td>
                                <td th:text="${post.publishedAt}"></td>
                                <td>
                                    <a href="javascript:void(0)" 
                                       class="btn btn-warning btn-sm btn-action"
                                       th:data-id="${post.id}"
                                       th:data-title="${post.title}"
                                       th:data-slug="${post.slug}"
                                       th:data-content="${post.content}"
                                       th:data-thumbnailUrl="${post.thumbnailUrl}" 
                                       th:data-type="${post.type}"
                                       onclick="openEditModal(this)">
                                       <i class="fa-solid fa-pen"></i>
                                    </a>
                                    
                                    <a th:href="@{/admin/news/delete/{id}(id=${post.id})}" 
                                       class="btn btn-danger btn-sm" 
                                       onclick="return confirm('Bạn có chắc chắn muốn xóa bài viết này không?')">
                                       <i class="fa-solid fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="newsModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Thêm Bài Viết Mới</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form th:action="@{/admin/news/save}" method="post" id="newsForm">
                    
                    <input type="hidden" name="id" id="postId">

                    <div class="mb-3">
                        <label class="form-label">Tiêu đề bài viết</label>
                        <input type="text" class="form-control" name="title" id="postTitle" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Slug (Đường dẫn tĩnh)</label>
                        <input type="text" class="form-control" name="slug" id="postSlug">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Loại bài viết</label>
                        <select class="form-select" name="type" id="postType">
                            <option value="NEWS">Tin tức</option>
                            <option value="EVENT">Sự kiện</option>
                            <option value="BLOG">Blog chia sẻ</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Link ảnh thu nhỏ (Thumbnail URL)</label>
                        <input type="text" class="form-control" name="thumbnailUrl" id="postThumbnailUrl">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nội dung</label>
                        <textarea class="form-control" name="content" id="postContent" rows="10" required></textarea>
                    </div>
                    
                    <div class="modal-footer p-0 pt-3">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-primary">Lưu bài viết</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function openEditModal(button) {
        // Lấy dữ liệu từ nút bấm
        var id = button.getAttribute("data-id");
        var title = button.getAttribute("data-title");
        var slug = button.getAttribute("data-slug");
        var content = button.getAttribute("data-content");
        var thumbnailUrl = button.getAttribute("data-thumbnailUrl"); // Đã sửa lỗi typo
        var type = button.getAttribute("data-type");

        // Đổ dữ liệu vào Form Modal
        document.getElementById("postId").value = id;
        document.getElementById("postTitle").value = title;
        document.getElementById("postSlug").value = slug;
        document.getElementById("postContent").value = content;
        document.getElementById("postThumbnailUrl").value = thumbnailUrl;
        document.getElementById("postType").value = type;

        // Đổi tiêu đề Modal
        document.getElementById("modalTitle").innerText = "Cập nhật bài viết";
        
        // Mở Modal (ID là newsModal chứ không phải addCourseModal)
        var myModal = new bootstrap.Modal(document.getElementById('newsModal'));
        myModal.show();
    }

    // Xử lý khi bấm nút Thêm mới để reset form
    document.getElementById("btnAdd").addEventListener("click", function() {
        document.getElementById("newsForm").reset();
        document.getElementById("postId").value = ""; 
        document.getElementById("modalTitle").innerText = "Thêm Bài Viết Mới";
    });
</script>
</body>
</html>
