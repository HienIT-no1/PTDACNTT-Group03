<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${pageTitle}">Quản lý Tin tức</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/admin/dashboard.css">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        
        <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

        <div class="col-md-10 p-4">
            <h3 class="mb-4">Tin tức & Sự kiện</h3>
            
            <div class="card shadow-sm">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span>Danh sách bài viết</span>
                    <button class="btn btn-primary btn-sm" id="btnAdd" onclick="resetForm()">
                        <i class="fa-solid fa-plus"></i> Đăng bài mới
                    </button>
                </div>
                <div class="card-body">                     
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Ảnh</th>
                                <th>Tên bài đăng</th>
                                <th>Loại</th>
                                <th>Trạng thái</th>
                                <th>Ngày đăng</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="post : ${listPosts}">
                                <td th:text="${post.id}"></td>
                                <td>
                                    <img th:if="${post.thumbnailUrl}" th:src="${post.thumbnailUrl}" style="width: 50px; height: 50px; object-fit: cover;" class="rounded">
                                </td>
                                <td th:text="${post.title}" class="fw-bold"></td>
                                <td><span class="badge bg-info text-dark" th:text="${post.type}"></span></td>
                                <td>
                                    <span th:class="${post.status.name() == 'PUBLISHED' ? 'badge bg-success' : (post.status.name() == 'DRAFT' ? 'badge bg-secondary' : 'badge bg-warning')}"
                                          th:text="${post.status}"></span>
                                </td>
                                <td th:text="${#temporals.format(post.publishedAt, 'dd/MM/yyyy')}"></td>
                                <td>
                                    <button class="btn btn-warning btn-sm" 
                                            th:data-id="${post.id}"
                                            th:data-title="${post.title}"
                                            th:data-slug="${post.slug}"
                                            th:data-short-desc="${post.shortDescription}"
                                            th:data-thumbnail="${post.thumbnailUrl}" 
                                            th:data-type="${post.type}"
                                            th:data-status="${post.status}"
                                            th:data-meta-title="${post.metaTitle}"
                                            th:data-meta-keyword="${post.metaKeyword}"
                                            th:data-meta-desc="${post.metaDescription}"
                                            
                                            th:data-sections="${post.sectionsJson}"
                                            
                                            onclick="openEditModal(this)">
                                        <i class="fa-solid fa-pen"></i>
                                    </button>
                                    
                                    <a th:href="@{/admin/news/delete/{id}(id=${post.id})}" 
                                       class="btn btn-danger btn-sm" 
                                       onclick="return confirm('Xóa bài viết sẽ xóa luôn các nội dung chi tiết. Tiếp tục?')">
                                       <i class="fa-solid fa-trash"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="newsModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-xl"> <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Thêm Bài Viết Mới</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form th:action="@{/admin/news/save}" method="post" id="newsForm">
                    <input type="hidden" name="id" id="postId">

                    <div class="row">
                        <div class="col-md-4 border-end">
                            <h6 class="text-primary">Thông tin chung</h6>
                            <div class="mb-3">
                                <label class="form-label">Tiêu đề</label>
                                <input type="text" class="form-control" name="title" id="postTitle" required onkeyup="generateSlug()">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Slug</label>
                                <input type="text" class="form-control" name="slug" id="postSlug">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Loại & Trạng thái</label>
                                <div class="d-flex gap-2">
                                    <select class="form-select" name="type" id="postType">
                                        <option value="NEWS">Tin tức</option>
                                        <option value="EVENT">Sự kiện</option>
                                        <option value="BLOG">Blog</option>
                                    </select>
                                    <select class="form-select" name="status" id="postStatus">
                                        <option value="PUBLISHED">Công khai</option>
                                        <option value="DRAFT">Nháp</option>
                                        <option value="HIDDEN">Ẩn</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Thumbnail URL</label>
                                <input type="text" class="form-control" name="thumbnailUrl" id="postThumbnailUrl">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Mô tả ngắn</label>
                                <textarea class="form-control" name="shortDescription" id="postShortDesc" rows="3"></textarea>
                            </div>
                            
                            <div class="card mb-3">
                                <div class="card-header py-1" data-bs-toggle="collapse" data-bs-target="#seoSection" style="cursor: pointer;">
                                    <small><i class="fa-solid fa-magnifying-glass"></i> SEO (Click mở)</small>
                                </div>
                                <div id="seoSection" class="collapse">
                                    <div class="card-body p-2">
                                        <input type="text" class="form-control form-control-sm mb-2" name="metaTitle" id="postMetaTitle" placeholder="Meta Title">
                                        <input type="text" class="form-control form-control-sm mb-2" name="metaKeyword" id="postMetaKeyword" placeholder="Keywords">
                                        <textarea class="form-control form-control-sm" name="metaDescription" id="postMetaDesc" rows="2" placeholder="Meta Description"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-8">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h6 class="text-primary mb-0">Nội dung chi tiết (Sections)</h6>
                                <button type="button" class="btn btn-success btn-sm" onclick="addSection()">
                                    <i class="fa-solid fa-plus"></i> Thêm đoạn
                                </button>
                            </div>

                            <div id="sectionsContainer" style="max-height: 600px; overflow-y: auto; padding-right: 5px;">
                                </div>
                            <div id="emptyMsg" class="text-center text-muted mt-5">Chưa có nội dung. Nhấn "Thêm đoạn" để bắt đầu.</div>
                        </div>
                    </div>
                    
                    <div class="modal-footer p-0 pt-3 border-top-0">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-primary">Lưu tất cả</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    var myModal = new bootstrap.Modal(document.getElementById('newsModal'));
    var sectionContainer = document.getElementById("sectionsContainer");
    var emptyMsg = document.getElementById("emptyMsg");

    // --- 1. HÀM TẠO HTML CHO 1 SECTION ---
    function getSectionTemplate(index, data = {}) {
        let id = data.id || '';
        let title = data.sectionTitle || '';
        let content = data.sectionContent || '';
        let mediaType = data.mediaType || 'NONE';
        let mediaUrl = data.mediaUrl || '';

        return `
        <div class="card mb-3 section-item border bg-light">
            <div class="card-body p-3">
                <div class="d-flex justify-content-between mb-2">
                    <span class="badge bg-secondary section-index">Đoạn #${index + 1}</span>
                    <button type="button" class="btn btn-outline-danger btn-sm py-0" onclick="removeSection(this)">
                        <i class="fa-solid fa-xmark"></i> Xóa
                    </button>
                </div>
                
                <input type="hidden" name="sections[${index}].id" value="${id}">
                
                <div class="row g-2">
                    <div class="col-md-8">
                        <input type="text" class="form-control form-control-sm fw-bold" 
                               name="sections[${index}].sectionTitle" 
                               placeholder="Tiêu đề mục (VD: 1. Mở đầu)" value="${title}">
                    </div>
                    <div class="col-md-4">
                        <select class="form-select form-select-sm" name="sections[${index}].mediaType">
                            <option value="NONE" ${mediaType === 'NONE' ? 'selected' : ''}>Không Media</option>
                            <option value="IMAGE" ${mediaType === 'IMAGE' ? 'selected' : ''}>Ảnh</option>
                            <option value="YOUTUBE" ${mediaType === 'YOUTUBE' ? 'selected' : ''}>Youtube</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <textarea class="form-control form-control-sm" 
                                  name="sections[${index}].sectionContent" 
                                  rows="3" placeholder="Nội dung chi tiết...">${content}</textarea>
                    </div>
                    <div class="col-12">
                        <input type="text" class="form-control form-control-sm text-muted" 
                               name="sections[${index}].mediaUrl" 
                               placeholder="Link ảnh hoặc Link Youtube (nếu chọn loại media)" value="${mediaUrl}">
                    </div>
                </div>
            </div>
        </div>`;
    }

    // --- 2. CÁC HÀM THAO TÁC DOM ---

    function addSection(data = {}) {
        emptyMsg.style.display = 'none';
        let currentIndex = sectionContainer.querySelectorAll('.section-item').length;
        let html = getSectionTemplate(currentIndex, data);
        sectionContainer.insertAdjacentHTML('beforeend', html);
    }

    function removeSection(btn) {
        if(confirm("Xóa đoạn này?")) {
            btn.closest('.section-item').remove();
            reindexSections(); // QUAN TRỌNG: Phải đánh lại số thứ tự sau khi xóa
            
            if (sectionContainer.querySelectorAll('.section-item').length === 0) {
                emptyMsg.style.display = 'block';
            }
        }
    }

    // Spring Boot binding dữ liệu theo index (sections[0], sections[1]...)
    // Nếu xóa đoạn giữa (ví dụ xóa 1 trong 0,1,2 -> còn 0,2) sẽ gây lỗi
    // Hàm này giúp đánh lại số thứ tự liên tục
    function reindexSections() {
        let items = sectionContainer.querySelectorAll('.section-item');
        items.forEach((item, index) => {
            // Update Text Label
            item.querySelector('.section-index').innerText = `Đoạn #${index + 1}`;
            
            // Update thuộc tính name của input/select/textarea
            item.querySelectorAll('input, select, textarea').forEach(input => {
                let name = input.getAttribute('name');
                if (name) {
                    // Regex thay thế số cũ bằng index mới
                    input.setAttribute('name', name.replace(/sections\[\d+\]/, `sections[${index}]`));
                }
            });
        });
    }

    // --- 3. HÀM MỞ MODAL & RESET ---

    function openEditModal(button) {
        resetFormUI(); // Xóa sạch form trước khi điền
        document.getElementById("modalTitle").innerText = "Cập nhật bài viết";

        // Điền thông tin cơ bản
        document.getElementById("postId").value = button.getAttribute("data-id");
        document.getElementById("postTitle").value = button.getAttribute("data-title");
        document.getElementById("postSlug").value = button.getAttribute("data-slug");
        document.getElementById("postShortDesc").value = button.getAttribute("data-short-desc");
        document.getElementById("postThumbnailUrl").value = button.getAttribute("data-thumbnail");
        document.getElementById("postType").value = button.getAttribute("data-type");
        document.getElementById("postStatus").value = button.getAttribute("data-status");
        
        // Điền SEO
        document.getElementById("postMetaTitle").value = button.getAttribute("data-meta-title");
        document.getElementById("postMetaKeyword").value = button.getAttribute("data-meta-keyword");
        document.getElementById("postMetaDesc").value = button.getAttribute("data-meta-desc");

        // Điền Sections (Parse JSON từ data attribute)
        let sectionsJson = button.getAttribute("data-sections");
        if (sectionsJson && sectionsJson !== "[]") {
            try {
                let sections = JSON.parse(sectionsJson);
                // Sắp xếp theo displayOrder (nếu có)
                sections.sort((a, b) => (a.displayOrder || 0) - (b.displayOrder || 0));
                
                sections.forEach(sec => addSection(sec));
            } catch (e) {
                console.error("Lỗi parse JSON sections:", e);
            }
        } else {
            addSection(); // Nếu chưa có gì thì thêm 1 đoạn trống
        }

        myModal.show();
    }

    function resetForm() {
        resetFormUI();
        document.getElementById("modalTitle").innerText = "Thêm Bài Viết Mới";
        document.getElementById("postStatus").value = "PUBLISHED"; 
        
        addSection(); // Mặc định thêm 1 đoạn trống
        myModal.show();
    }

    function resetFormUI() {
        document.getElementById("newsForm").reset();
        document.getElementById("postId").value = "";
        sectionContainer.innerHTML = ""; // Xóa hết sections cũ trên UI
        emptyMsg.style.display = 'block';
    }

    function generateSlug() {
        let title = document.getElementById("postTitle").value;
        let slug = title.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        slug = slug.replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-');
        document.getElementById("postSlug").value = slug;
    }
</script>
</body>
</html>
